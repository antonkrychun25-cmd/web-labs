<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="padding:20px;">
    <a href="index.html">Назад</a>
    <h3>Position & Z-index</h3>
    <div style="position: relative; height: 100px; border: 1px solid red;">
        <div style="position: absolute; z-index: 2; top: 10px; left: 10px; background: blue; color: white; padding: 10px;">Z-index: 2</div>
        <div style="position: absolute; z-index: 1; top: 25px; left: 25px; background: green; color: white; padding: 10px;">Z-index: 1</div>
    </div>
    <h3>Float & Clear</h3>
    <div style="float: left; width: 100px; height: 50px; background: orange; margin: 10px;">FLOAT LEFT</div>
    <p>Цей текст обтікає блок ліворуч.</p>
    <div style="clear: both; background: #ccc; padding: 10px;">Блок з CLEAR: BOTH (під обтіканням)</div>
</body>
</html>

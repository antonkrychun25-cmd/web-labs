<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunglass Shop - Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="/web-labs/index.html" class="weblabs-link">← На головну</a>

    <header class="header">
        <div class="container flex-header">
            <div class="logo">SUNGLASS</div>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="page2.html" class="active">PRODUCTS</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2 class="catalog-title">OUR COLLECTION</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="img/glass1.png" alt="Glass 1">
                <h3>Aviator Classic</h3>
                <p class="price">$150.00</p>
                <button class="btn-buy">ADD TO CART</button>
            </div>
            <div class="product-card">
                <img src="img/glass2.png" alt="Glass 2">
                <h3>Wayfarer Retro</h3>
                <p class="price">$120.00</p>
                <button class="btn-buy">ADD TO CART</button>
            </div>
            <div class="product-card">
                <img src="img/glass3.png" alt="Glass 3">
                <h3>Round Metal</h3>
                <p class="price">$180.00</p>
                <button class="btn-buy">ADD TO CART</button>
            </div>
        </div>
    </main>
</body>
</html>
